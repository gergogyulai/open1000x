# Pushing a tag like v0.2.0 builds a universal Open1000X.app, publishes a GitHub release and updates the
# Homebrew cask. Tags with a suffix (v0.2.0-beta.1) become pre-releases and leave the cask alone.
# Running it by hand builds the zip as a workflow artifact without releasing anything.
#
# Secrets, all optional:
#   SIGNING_CERT_P12, SIGNING_CERT_PASSWORD  from scripts/make-signing-cert.sh. Without them the app is
#                                            signed ad-hoc and loses its Bluetooth permission on every update.
#   TAP_TOKEN                                a fine-grained token with Contents: read and write on
#                                            gergogyulai/homebrew-tap. Without it the cask isn't updated.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      HAS_CERT: ${{ secrets.SIGNING_CERT_P12 != '' }}
      HAS_TAP_TOKEN: ${{ secrets.TAP_TOKEN != '' }}
      TAP_REPO: gergogyulai/homebrew-tap
    steps:
      - uses: actions/checkout@v5

      - name: Version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev.$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "ZIP=Open1000X-$VERSION.zip" >> "$GITHUB_ENV"
          case "$VERSION" in *-*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;; *) echo "PRERELEASE=false" >> "$GITHUB_ENV" ;; esac
          swift --version

      - name: Test
        run: swift test

      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(uuidgen)"
          echo "$SIGNING_CERT_P12" | base64 -D > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/signing.p12" -k "$KC" -P "$SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/signing.p12"
          IDENTITY="$(security find-identity -p codesigning "$KC" | sed -n 's/.*"\(.*\)".*/\1/p' | head -1)"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build
        run: |
          UNIVERSAL=1 ./scripts/build-app.sh
          codesign --verify --strict --deep build/Open1000X.app
          codesign -d -r- build/Open1000X.app
          ditto -c -k --keepParent build/Open1000X.app "$ZIP"
          echo "SHA256=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)" >> "$GITHUB_ENV"

      - name: Upload build
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP }}
          path: ${{ env.ZIP }}

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          ## Install

          \`\`\`sh
          brew install gergogyulai/tap/open1000x
          \`\`\`

          Or download **$ZIP**, unzip it and move Open1000X.app to Applications. The app isn't notarized, so the
          first launch is blocked: open **System Settings → Privacy & Security** and click **Open Anyway**.
          \`mdrctl\` is inside the app at \`Open1000X.app/Contents/MacOS/mdrctl\`.

          SHA-256: \`$SHA256\`
          NOTES
          FLAGS=""
          [ "$PRERELEASE" = true ] && FLAGS="--prerelease"
          gh release create "$GITHUB_REF_NAME" "$ZIP" $FLAGS \
            --title "Open1000X $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes

      - name: Update Homebrew cask
        if: github.ref_type == 'tag' && env.PRERELEASE == 'false' && env.HAS_TAP_TOKEN == 'true'
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          TAP="$RUNNER_TEMP/tap"
          git clone "https://x-access-token:$TAP_TOKEN@github.com/$TAP_REPO.git" "$TAP"
          mkdir -p "$TAP/Casks"
          sed -e "s/__VERSION__/$VERSION/" -e "s/__SHA256__/$SHA256/" \
            -e '/^# Template for/d' -e '/^# The release workflow/d' \
            packaging/homebrew/open1000x.rb > "$TAP/Casks/open1000x.rb"
          cd "$TAP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/open1000x.rb
          git commit -m "open1000x $VERSION"
          git push
